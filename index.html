<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi PokéDex</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    body {
      background-color: #eef2f3;
      padding-top: 50px;
    }

    .pokemon-card {
      border-radius: 15px;
      transition: transform 0.2s;
      border: none;
    }

    .pokemon-card:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }

    .img-bg {
      background-color: #f8f9fa;
      border-radius: 15px 15px 0 0;
      padding: 20px;
    }

    .card-title {
      text-transform: capitalize;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="text-center mb-5">Pokemones</h1>

    <!-- Feature 4 – Eilin: contenedor con id para que JS pueda insertar las cards -->
    <div class="row g-4" id="pokemon-container">
      <!-- Las cards se generan dinámicamente desde app.js -->
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Referencia al archivo JS del proyecto -->
  <script src="app.js"></script>
</body>
</html>
