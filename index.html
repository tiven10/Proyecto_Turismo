<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi PokéDex</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    body {
      background-color: #eef2f3; 
      padding-top: 50px;
    }
    .pokemon-card {
      border-radius: 15px;
      transition: transform 0.2s; /* Para que se mueva suave al pasar el mouse*/
      border: none;
    }
    .pokemon-card:hover {
      transform: scale(1.05); /* Se agranda un poquito */
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }
    .img-bg {
      background-color: #f8f9fa; /* Fondo gris clarito para la foto */
      border-radius: 15px 15px 0 0;
      padding: 20px;
    }
    .card-title {
      text-transform: capitalize;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="text-center mb-5">Pokemones</h1>

    <!-- Se agrega id="pokemon-container" para que JS pueda insertar las cards -->
    <!-- Se eliminan las cards hardcodeadas (Pikachu, Charmander, etc.) -->
    <div class="row g-4" id="pokemon-container">
      <!-- Las cards se generan dinámicamente desde app.js -->
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Se agrega referencia al archivo JS -->
  <script src="app.js"></script>
</body>
</html>
